[project]
name = "spp"
version = "0.1.0"
description = "Multi-timeframe harami / inside-bar breakout strategy for CME futures"
requires-python = ">=3.11"
dependencies = ["nautilus_trader>=1.221.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
